<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Создание товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <span class="badge text-bg-success">Создание товара</span>
                </h2>
                <a href="/items" class="btn btn-secondary ms-auto bi bi-arrow-left-square"> Главная</a>
            </div>
        </div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row p-2">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/items/create}"
                          th:object="${item}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="title" class="form-label">Название товара</label>
                            <input type="text"
                                   id="title"
                                   th:field="*{title}"
                                   class="form-control"
                                   placeholder="Введите название товара"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Описание</label>
                            <textarea id="description"
                                      th:field="*{description}"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Введите описание товара"
                                      required></textarea>
                        </div>


                        <div class="mb-3">
                            <label for="image" class="form-label">Изображение</label>
                            <input type="file"
                                   id="image"
                                   name="image"
                                   class="form-control"
                                   accept="image/*"
                                   required>
                        </div>


                        <div class="mb-3">
                            <label for="price" class="form-label">Цена</label>
                            <div class="input-group">
                                <input type="number"
                                       id="price"
                                       th:field="*{price}"
                                       class="form-control"
                                       placeholder="Введите цену"
                                       min="0"
                                       required>
                                <span class="input-group-text">руб.</span>
                            </div>
                        </div>

                        <div class="hstack gap-3">
                            <button type="submit" class="btn btn-success bi bi-check-circle">
                                Сохранить
                            </button>
                            <a href="/items" class="btn btn-outline-secondary ms-auto bi bi-x-circle">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
